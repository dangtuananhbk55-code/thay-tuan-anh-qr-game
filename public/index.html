<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bình chọn cuối giờ 😄</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#fff7fb,#f6f2ff);overflow:hidden}
.card{width:min(94vw,760px);min-height:620px;background:#fff;border-radius:30px;box-shadow:0 22px 70px rgba(0,0,0,.14);padding:34px 20px;text-align:center;position:relative;overflow:hidden}
.logo{font-size:64px} h1{font-size:clamp(30px,7vw,56px);margin:10px 0;color:#1f2937}.sub{font-size:18px;color:#667085}
.arena{position:relative;height:350px;margin-top:10px}
button{border:0;border-radius:999px;font-weight:900;cursor:pointer;position:absolute;transition:all .22s ease;white-space:nowrap}
#yesBtn{left:36%;top:52%;transform:translate(-50%,-50%);padding:20px 38px;font-size:27px;background:#16a34a;color:#fff;z-index:4}
#noBtn{left:67%;top:52%;transform:translate(-50%,-50%);padding:18px 34px;font-size:23px;background:#ef4444;color:#fff;z-index:5}
.stats{font-size:16px;color:#475467}.done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:20}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓😄</div>
  <h1>Thầy Tuấn Anh dạy có hay không?</h1>
  <div class="sub">Chọn thật lòng nhé 😎</div>
  <div class="arena" id="arena">
    <button id="yesBtn">CÓ 👍</button>
    <button id="noBtn">KHÔNG 😝</button>
  </div>
  <div class="stats">✅ CÓ: <b id="yesCount">0</b> · 🏃 KHÔNG: <b id="noClicks">0</b></div>
  <div class="done" id="done"><div><div style="font-size:80px">🎉👏</div><h2>Cảm ơn em! 😎</h2></div></div>
</div>
<script>
const socket=io(), yesBtn=document.getElementById("yesBtn"), noBtn=document.getElementById("noBtn"),
arena=document.getElementById("arena"), yesCount=document.getElementById("yesCount"),
noClicks=document.getElementById("noClicks"), done=document.getElementById("done");
let lastNo=0, yesSent=false;
function moveNo(){noBtn.style.left=(10+Math.random()*80)+"%";noBtn.style.top=(12+Math.random()*72)+"%";}
function render(s){
 yesCount.textContent=s.yesCount; noClicks.textContent=s.noClicks;
 let ys=Math.min(1+s.noClicks*.06,3.2), ns=Math.max(1-s.noClicks*.035,.16);
 yesBtn.style.transform=`translate(-50%,-50%) scale(${ys})`;
 noBtn.style.transform=`translate(-50%,-50%) scale(${ns})`;
 if(s.noClicks>lastNo){moveNo();lastNo=s.noClicks}
 noBtn.style.display=s.noClicks>=28?"none":"block";
}
yesBtn.onclick=()=>{if(!yesSent){yesSent=true;socket.emit("yes");done.style.display="flex"}};
noBtn.onclick=()=>{socket.emit("no");moveNo()};
socket.on("state",render);
</script>
</body>
</html>
