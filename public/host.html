<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Màn hình bình chọn - Thầy Tuấn Anh</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;width:100vw;height:100vh;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:
    radial-gradient(circle at 18% 8%,rgba(93,63,211,.20),transparent 28%),
    radial-gradient(circle at 76% 10%,rgba(226,61,114,.18),transparent 30%),
    linear-gradient(135deg,#11131a,#17131b 50%,#0b0e13);
}
.header{
  height:20vh;padding:20px 32px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:28px
}
.heading h1{
  font-size:clamp(34px,4.9vw,72px);margin:0;font-weight:900;letter-spacing:-1px
}
.heading p{
  font-size:clamp(17px,1.8vw,27px);color:#b9bac2;margin:12px 0 0
}
.qrbox{
  background:rgba(255,255,255,.96);padding:10px;border-radius:22px;text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.32);flex:none;color:#111
}
.qrbox img{
  width:min(13.5vw,180px);height:min(13.5vw,180px);display:block;background:#fff
}
.qrbox div{font-weight:900;font-size:13px;margin-top:5px}

.arena{height:44vh;position:relative;overflow:hidden}

button{
  border:0;border-radius:999px;font-weight:900;position:absolute;white-space:nowrap;
  transition:left .36s cubic-bezier(.2,.8,.2,1),top .36s cubic-bezier(.2,.8,.2,1),
             transform .25s ease,opacity .25s ease
}
#yes{
  left:34%;top:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#1cc865,#0e9e4d);color:white;padding:34px 74px;
  font-size:clamp(38px,5.6vw,88px);
  box-shadow:0 0 32px rgba(18,168,75,.25);z-index:4
}
#no{
  left:77%;top:48%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#ff5a63,#dc3440);color:white;padding:18px 34px;
  font-size:clamp(18px,2.4vw,38px);
  box-shadow:0 0 25px rgba(239,65,72,.2);z-index:5
}

.dashboard{
  height:30vh;padding:0 28px 12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.card{
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(35,38,48,.88),rgba(21,23,30,.88));
  border-radius:24px;padding:18px 20px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.18)
}
.card .label{
  font-size:clamp(14px,1.25vw,20px);font-weight:800;color:#e4e5e8;
  min-height:48px
}
.card .num{
  font-size:clamp(36px,4.5vw,68px);font-weight:900;line-height:1
}
.card .sub{
  font-size:clamp(13px,1.05vw,17px);color:#b9bbc2;margin-top:8px
}
.c1 .num{color:#8b5cf6}
.c2 .num{color:#20c568}
.c3 .num{color:#ff454d}
.c4 .num{color:#2f9bf4}

.progressWrap{
  position:fixed;left:28px;right:28px;bottom:18px;height:7vh
}
.track{
  height:16px;background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)
}
.bar{
  width:0%;height:100%;background:linear-gradient(90deg,#16b95a,#2ad774);border-radius:999px;
  transition:width .5s ease
}
.scale{
  display:flex;justify-content:space-between;margin-top:5px;
  color:#c4c5ca;font-size:13px
}
.finalMsg{
  text-align:center;margin-top:3px;font-size:clamp(16px,1.5vw,23px);
  color:#22d866;font-weight:800;min-height:26px
}

.controls{
  position:fixed;right:12px;bottom:8px;z-index:60;
  display:flex;gap:7px
}
.controls button{
  position:static;border-radius:8px;padding:8px 11px;
  font-size:11px;opacity:.42;cursor:pointer
}
.controls button:hover{opacity:1}
#finish{
  background:linear-gradient(135deg,#d84b42,#a8231b);color:white
}
#reset{
  background:#30343d;color:white
}

.finishedBadge{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:55;background:linear-gradient(135deg,#d84b42,#a8231b);color:#fff;border-radius:999px;
  padding:10px 20px;font-weight:900;font-size:16px;
  display:none;box-shadow:0 8px 25px rgba(0,0,0,.35)
}

.confetti{
  position:fixed;top:-8vh;z-index:50;pointer-events:none;
  animation:fall 3s ease-out forwards
}
@keyframes fall{
  to{transform:translateY(116vh) rotate(600deg);opacity:0}
}
</style>
</head>
<body>

<div class="finishedBadge" id="finishedBadge">
  🔒 BÌNH CHỌN ĐÃ KẾT THÚC
</div>

<div class="header">
  <div class="heading">
    <h1>🎓 Thầy Tuấn Anh dạy có hay, có dễ hiểu không?</h1>
    <p>📱 Quét QR bằng 4G/5G/Wi‑Fi để cùng bình chọn</p>
  </div>

  <div class="qrbox" id="qrbox">
    <img src="/qr" alt="QR bình chọn">
    <div>QUÉT ĐỂ BÌNH CHỌN</div>
  </div>
</div>

<div class="arena">
  <button id="yes">CÓ 👍</button>
  <button id="no">KHÔNG 😝</button>
</div>

<div class="dashboard">
  <div class="card c1">
    <div class="label">1️⃣ SỐ LƯỢT THAM GIA</div>
    <div class="num" id="participants">0</div>
    <div class="sub">lượt đang được tính</div>
  </div>

  <div class="card c2">
    <div class="label">2️⃣ SỐ LƯỢT CHỌN CÓ</div>
    <div class="num" id="yesCount">0</div>
    <div class="sub">lượt chọn</div>
  </div>

  <div class="card c3">
    <div class="label">3️⃣ SỐ LƯỢT CHỌN KHÔNG</div>
    <div class="num" id="noCount">0</div>
    <div class="sub">lượt chọn</div>
  </div>

  <div class="card c4">
    <div class="label">4️⃣ TỶ LỆ CHỌN CÓ</div>
    <div class="num"><span id="yesPercent">0</span>%</div>
    <div class="sub"><span id="fraction">0 / 0</span></div>
  </div>
</div>

<div class="progressWrap">
  <div class="track"><div class="bar" id="bar"></div></div>

  <div class="scale">
    <span>0%</span><span>25%</span><span>50%</span>
    <span>75%</span><span>100%</span>
  </div>

  <div class="finalMsg" id="finalMsg"></div>
</div>

<div class="controls">
  <button id="finish">KẾT THÚC</button>
  <button id="reset">RESET</button>
</div>

<script>
const socket = io();

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const qrbox = document.getElementById("qrbox");
const finishedBadge = document.getElementById("finishedBadge");

const participantsEl = document.getElementById("participants");
const yesCountEl = document.getElementById("yesCount");
const noCountEl = document.getElementById("noCount");
const yesPercentEl = document.getElementById("yesPercent");
const fractionEl = document.getElementById("fraction");
const bar = document.getElementById("bar");
const finalMsg = document.getElementById("finalMsg");

let lastGlobalNoAttempts = 0;
let lastYesCount = 0;
let celebrated100 = false;
let isFinished = false;

function moveNo(){
  no.style.left = (58 + Math.random()*36) + "%";
  no.style.top  = (14 + Math.random()*70) + "%";
}

function confetti(amount=30){
  const icons = ["🎉","👏","✨","👍","💚"];

  for(let i=0;i<amount;i++){
    const e = document.createElement("div");
    e.className = "confetti";
    e.textContent = icons[Math.floor(Math.random()*icons.length)];
    e.style.left = Math.random()*100 + "vw";
    e.style.fontSize = (20+Math.random()*34) + "px";
    e.style.animationDelay = (Math.random()*.5) + "s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),3600);
  }
}

function showFinishedUI(){
  isFinished = true;

  finishedBadge.style.display = "block";

  qrbox.style.opacity = ".18";
  qrbox.style.filter = "grayscale(1)";

  document.getElementById("finish").disabled = true;
  document.getElementById("finish").style.opacity = ".18";

  finalMsg.textContent =
    "✅ Cảm ơn mọi người đã tham gia bình chọn.";

  confetti(45);
}

function render(state){
  participantsEl.textContent = state.participants;
  yesCountEl.textContent = state.yesCount;
  noCountEl.textContent = 0;

  yesPercentEl.textContent = state.yesPercent;
  fractionEl.textContent =
    `${state.yesCount} / ${state.participants}`;

  bar.style.width = state.yesPercent + "%";

  const yesScale =
    Math.min(1 + state.globalNoAttempts*.055 + state.yesCount*.015, 3.6);

  const noScale =
    Math.max(1 - state.globalNoAttempts*.035, .15);

  yes.style.transform =
    `translate(-50%,-50%) scale(${yesScale})`;

  no.style.transform =
    `translate(-50%,-50%) scale(${noScale})`;

  no.style.opacity =
    Math.max(1 - state.globalNoAttempts*.025, .13);

  if(
    !state.pollFinished &&
    state.globalNoAttempts > lastGlobalNoAttempts
  ){
    moveNo();
    lastGlobalNoAttempts = state.globalNoAttempts;
  }

  no.style.display =
    state.globalNoAttempts >= 28 ? "none" : "block";

  if(state.yesCount > lastYesCount){
    confetti(Math.min(
      8 * (state.yesCount-lastYesCount),
      24
    ));
    lastYesCount = state.yesCount;
  }

  if(state.pollFinished){
    if(!isFinished) showFinishedUI();
    return;
  }

  if(
    state.participants > 0 &&
    state.yesCount === state.participants
  ){
    finalMsg.textContent =
      "🎉 100% chọn CÓ! Cảm ơn mọi người đã tham gia bình chọn! 🎉";

    if(!celebrated100){
      celebrated100 = true;
      confetti(60);
    }
  }else{
    finalMsg.textContent =
      state.participants > 0
      ? `Đang có ${state.yesPercent}% lượt tham gia chọn CÓ`
      : "Đang chờ mọi người quét QR...";

    celebrated100 = false;
  }
}

socket.on("state", render);
socket.on("pollFinished", () => {
  if(!isFinished) showFinishedUI();
});

socket.on("pollReset", () => {
  lastGlobalNoAttempts = 0;
  lastYesCount = 0;
  celebrated100 = false;
  isFinished = false;

  finishedBadge.style.display = "none";
  qrbox.style.opacity = "1";
  qrbox.style.filter = "none";

  const finishBtn = document.getElementById("finish");
  finishBtn.disabled = false;
  finishBtn.style.opacity = ".42";
});

document.getElementById("finish").addEventListener("click", () => {
  if(isFinished) return;

  if(confirm(
    "Kết thúc bình chọn?\n\n" +
    "Sau khi kết thúc, sẽ không nhận thêm lượt mới. " +
    "Lần tiếp theo F5/mở lại màn hình này, game sẽ bắt đầu lại từ 0."
  )){
    socket.emit("finishPoll");
  }
});

document.getElementById("reset").addEventListener("click", () => {
  if(confirm("Reset ngay toàn bộ phòng bình chọn về 0?")){
    socket.emit("resetPoll");
  }
});
</script>
</body>
</html>
