<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bình chọn cuối giờ 😄</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#311329,#130c15 62%,#08090c);
  color:#fff;overflow:hidden
}
.card{
  width:min(94vw,760px);min-height:640px;padding:34px 22px;
  background:rgba(15,17,22,.94);border:1px solid rgba(255,255,255,.1);
  border-radius:30px;box-shadow:0 24px 80px rgba(0,0,0,.5);
  text-align:center;position:relative;overflow:hidden
}
.icon{font-size:60px}
h1{font-size:clamp(30px,7vw,54px);margin:8px 0 10px}
.sub{font-size:17px;color:#b7b7bf;margin-bottom:8px}
.arena{position:relative;height:350px;margin-top:10px}
button{
  border:0;border-radius:999px;font-weight:900;cursor:pointer;position:absolute;
  transition:left .24s ease,top .24s ease,transform .22s ease,opacity .22s ease;
  white-space:nowrap;-webkit-tap-highlight-color:transparent
}
#yesBtn{
  left:34%;top:53%;transform:translate(-50%,-50%) scale(1);
  padding:20px 34px;font-size:24px;background:#10a84b;color:white;
  box-shadow:0 0 28px rgba(16,168,75,.35);z-index:4
}
#noBtn{
  left:68%;top:53%;transform:translate(-50%,-50%) scale(1);
  padding:20px 34px;font-size:24px;background:#ef3f47;color:white;
  box-shadow:0 0 24px rgba(239,63,71,.25);z-index:5
}
.live{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  font-size:15px;color:#d0d2d8
}
.stat{background:#1b1e25;border-radius:16px;padding:12px}
.stat b{font-size:22px;color:white}
.note{font-size:13px;color:#858891;margin-top:12px}
.done{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,9,12,.97);z-index:20;padding:24px
}
.done h2{font-size:44px;color:#1ed760;margin:10px 0}
.done p{font-size:20px;color:#d8d8dc}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎓😄</div>
  <h1>Thầy Tuấn Anh dạy có hay không?</h1>
  <div class="sub">Chọn thật lòng nhé 😎</div>

  <div class="arena">
    <button id="yesBtn">CÓ 👍</button>
    <button id="noBtn">KHÔNG 😝</button>
  </div>

  <div class="live">
    <div class="stat">👥 Lượt tham gia<br><b id="participants">0</b></div>
    <div class="stat">✅ Đã chọn CÓ<br><b id="yesCount">0</b></div>
  </div>

  <div class="note">
    Mỗi lượt mở trang bắt đầu lại với hai nút CÓ / KHÔNG như nhau.
  </div>

  <div class="done" id="done">
    <div>
      <div style="font-size:76px">🎉👏</div>
      <h2>Đã ghi nhận CÓ!</h2>
      <p>Cảm ơn em đã tham gia bình chọn 😎</p>
    </div>
  </div>
</div>

<script>
const socket = io();

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const participantsEl = document.getElementById("participants");
const yesCountEl = document.getElementById("yesCount");
const done = document.getElementById("done");

// Mỗi lần mở/tải lại trang = session mới.
function newSessionId(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }
  return "s-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

let sessionId = newSessionId();
let alreadyVoted = false;

// QUAN TRỌNG:
// Biến này CHỈ thuộc điện thoại hiện tại.
// Không lấy tổng KHÔNG từ server.
let localNoAttempts = 0;

function join(){
  socket.emit("joinSession", sessionId);
}

socket.on("connect", join);

socket.on("joined", info => {
  alreadyVoted = !!info.alreadyVotedYes;

  if(alreadyVoted){
    yesBtn.textContent = "ĐÃ CHỌN CÓ ✅";
    yesBtn.style.pointerEvents = "none";
  }else{
    yesBtn.textContent = "CÓ 👍";
    yesBtn.style.pointerEvents = "auto";
  }
});

function resetLocalButtons(){
  localNoAttempts = 0;

  yesBtn.style.left = "34%";
  yesBtn.style.top = "53%";
  yesBtn.style.transform = "translate(-50%,-50%) scale(1)";
  yesBtn.style.opacity = "1";

  noBtn.style.left = "68%";
  noBtn.style.top = "53%";
  noBtn.style.transform = "translate(-50%,-50%) scale(1)";
  noBtn.style.opacity = "1";
  noBtn.style.display = "block";
  noBtn.textContent = "KHÔNG 😝";
}

function moveLocalNo(){
  noBtn.style.left = (9 + Math.random()*82) + "%";
  noBtn.style.top  = (12 + Math.random()*72) + "%";
}

function renderLocalButtons(){
  const yesScale = Math.min(1 + localNoAttempts*.18, 3.0);
  const noScale = Math.max(1 - localNoAttempts*.10, .22);

  yesBtn.style.transform =
    `translate(-50%,-50%) scale(${yesScale})`;

  noBtn.style.transform =
    `translate(-50%,-50%) scale(${noScale})`;

  noBtn.style.opacity =
    Math.max(1 - localNoAttempts*.07, .20);

  if(localNoAttempts >= 7){
    noBtn.textContent = "KHÔNG? 🥹";
  }

  // Trên điện thoại KHÔNG không biến mất quá sớm.
  // Cho chơi đến 12 lần mới biến mất.
  if(localNoAttempts >= 12){
    noBtn.style.display = "none";
  }
}

// State từ server chỉ dùng để hiện số liệu.
// KHÔNG dùng globalNoAttempts để chỉnh nút trên điện thoại.
socket.on("state", state => {
  participantsEl.textContent = state.participants;
  yesCountEl.textContent = state.yesCount;
});

yesBtn.addEventListener("click", () => {
  if(alreadyVoted) return;

  alreadyVoted = true;
  socket.emit("voteYes", sessionId);

  yesBtn.textContent = "ĐÃ CHỌN CÓ ✅";
  yesBtn.style.pointerEvents = "none";
  done.style.display = "flex";
});

noBtn.addEventListener("click", () => {
  localNoAttempts += 1;

  // Gửi 1 lượt KHÔNG lên HOST để cộng tổng.
  socket.emit("tryNo");

  // Chỉ thay đổi nút của điện thoại này.
  moveLocalNo();
  renderLocalButtons();
});

socket.on("pollReset", () => {
  sessionId = newSessionId();
  alreadyVoted = false;

  yesBtn.textContent = "CÓ 👍";
  yesBtn.style.pointerEvents = "auto";
  done.style.display = "none";

  resetLocalButtons();
  join();
});

// Khi vừa vào trang, luôn bắt đầu hai nút ngang nhau.
resetLocalButtons();
</script>
</body>
</html>
