<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Màn hình trình chiếu</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:Arial,sans-serif;background:linear-gradient(135deg,#edf6ff,#fff7fb,#f5efff)}
.header{height:27vh;padding:24px 40px;display:flex;align-items:center;justify-content:space-between;gap:30px}
h1{font-size:clamp(36px,5.4vw,74px);margin:0;color:#1f2937}.sub{font-size:clamp(18px,2vw,28px);color:#667085;margin-top:10px}
.qrbox{background:#fff;padding:12px;border-radius:20px;box-shadow:0 12px 38px rgba(0,0,0,.14);text-align:center;flex:none}
.qrbox img{width:min(18vw,210px);height:min(18vw,210px);display:block}.qrbox div{font-weight:900;margin-top:7px}
.arena{height:59vh;position:relative;overflow:hidden}
button{border:0;border-radius:999px;font-weight:900;position:absolute;transition:all .28s ease;white-space:nowrap}
#yes{left:34%;top:48%;transform:translate(-50%,-50%);background:#16a34a;color:#fff;padding:25px 50px;font-size:clamp(30px,4vw,60px);z-index:4}
#no{left:68%;top:48%;transform:translate(-50%,-50%);background:#ef4444;color:#fff;padding:23px 46px;font-size:clamp(27px,3.5vw,52px);z-index:5}
.footer{height:14vh;display:flex;justify-content:center;align-items:center;gap:50px;font-size:clamp(22px,2.6vw,38px);font-weight:900}
.pill{background:#fff;border-radius:999px;padding:14px 28px;box-shadow:0 8px 24px rgba(0,0,0,.09)}
#reset{position:fixed;right:18px;bottom:16px;background:#111827;color:#fff;padding:10px 16px;font-size:14px;opacity:.35}
</style>
</head>
<body>
<div class="header">
 <div>
   <h1>🎓 Thầy Tuấn Anh dạy có hay không?</h1>
   <div class="sub">📱 Quét QR bằng 4G/5G/Wi‑Fi để cùng bình chọn</div>
 </div>
 <div class="qrbox">
   <img src="/qr" alt="Mã QR bình chọn">
   <div>QUÉT ĐỂ BÌNH CHỌN</div>
 </div>
</div>
<div class="arena">
 <button id="yes">CÓ 👍</button>
 <button id="no">KHÔNG 😝</button>
</div>
<div class="footer">
 <div class="pill">✅ CÓ: <span id="yesCount">0</span></div>
 <div class="pill">🏃 KHÔNG: <span id="noClicks">0</span></div>
</div>
<button id="reset">RESET</button>
<script>
const socket=io(),yes=document.getElementById("yes"),no=document.getElementById("no"),
yc=document.getElementById("yesCount"),nc=document.getElementById("noClicks");
let lastNo=0;
function moveNo(){no.style.left=(7+Math.random()*86)+"%";no.style.top=(10+Math.random()*76)+"%";}
function render(s){
 yc.textContent=s.yesCount;nc.textContent=s.noClicks;
 let ys=Math.min(1+s.noClicks*.06+s.yesCount*.02,3.7), ns=Math.max(1-s.noClicks*.033,.15);
 yes.style.transform=`translate(-50%,-50%) scale(${ys})`;
 no.style.transform=`translate(-50%,-50%) scale(${ns})`;
 if(s.noClicks>lastNo){moveNo();lastNo=s.noClicks}
 no.style.display=s.noClicks>=28?"none":"block";
}
socket.on("state",render);
document.getElementById("reset").onclick=()=>socket.emit("reset");
</script>
</body>
</html>
